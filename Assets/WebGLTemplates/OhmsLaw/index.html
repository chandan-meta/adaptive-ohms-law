<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preload" as="image" href="TemplateData/loader.webp">
    <link rel="stylesheet" href="TemplateData/style.css?v=20261024-fullscreen">
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <button id="fullscreen-button" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="expand" d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>
        <path class="collapse" d="M3 8h5V3m13 5h-5V3M8 21v-5H3m13 5v-5h5"/>
      </svg>
    </button>
    <!-- The module's loading screen: the supplied artwork as it is (TemplateData/loader.webp), a live bar over its painted
         one and a little drifting light. The artwork carries the title, so the bar's name is for screen readers only. -->
    <div id="loader">
      <div id="stage">
        <div id="breath"></div>
        <canvas id="dust"></canvas>
        <div id="bar" role="progressbar" aria-label="Loading Ohm's Law Module" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5), // Keep Retina screens from multiplying the 3D render cost.
        autoSyncPersistentDataPath: true, // the learner's progress saves on change (the manual sync is deprecated)
      };
    </script>
    <script src="TemplateData/loader.js?v=20261024-fullscreen"></script>
  </body>
</html>
